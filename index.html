  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function () {
        try {
          var originalFetch = window.fetch ? window.fetch.bind(window) : undefined;
          var currentFetch = originalFetch;
          var desc = Object.getOwnPropertyDescriptor(window, 'fetch') || Object.getOwnPropertyDescriptor(Window.prototype, 'fetch');
          if (!desc || desc.configurable !== false) {
            Object.defineProperty(window, 'fetch', {
              configurable: true,
              enumerable: true,
              get: function () {
                return currentFetch;
              },
              set: function (val) {
                if (typeof val === 'function') {
                  currentFetch = val;
                }
              }
            });
          }
        } catch (e) {}

        window.addEventListener(
          'error',
          function (event) {
            var msg = (event && event.message) || '';
            var file = (event && event.filename) || '';
            if (
              msg.indexOf('Cannot set property fetch') !== -1 ||
              file.indexOf('chrome-extension://') !== -1
            ) {
              event.stopImmediatePropagation();
              event.preventDefault();
              return false;
            }
          },
          true
        );

        window.addEventListener(
          'unhandledrejection',
          function (event) {
            var reason = event && event.reason;
            var msg = (reason && (reason.message || String(reason))) || '';
            if (msg.indexOf('Cannot set property fetch') !== -1) {
              event.stopImmediatePropagation();
              event.preventDefault();
            }
          },
          true
        );
      })();
    </script>
